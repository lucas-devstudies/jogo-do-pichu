<div class="menu-group d-flex flex-center justify-content-center align-items-center">
    <!-- principal -->
    @if (select=='home') {
        <img src="assets/icons/home-white.svg" width="28px" height="28px">
    }@else {
        <img src="assets/icons/home-primary.svg" width="28px" height="28px" (click)="toHome()">
    }
    <!-- cartão -->
    @if (select=='account') {
        <img src="assets/icons/card-white.svg" width="28px" height="28px">
    }@else {
        <img src="assets/icons/card-primary.svg" width="28px" height="28px" (click)="toAccount()">
    }

    <!-- histórico -->
    @if (select=='history') {
        <img src="assets/icons/history-white.svg" width="28px" height="28px">
    }@else {
        <img src="assets/icons/history-primary.svg" width="28px" height="28px" (click)="toHistory()">
    }
    
    <!-- opções -->
    @if (select=='gear') {
        <img src="assets/icons/gear-white.svg" width="28px" height="28px">
    }@else {
        <img src="assets/icons/gear-primary.svg" width="28px" height="28px" (click)="toConfig()">
    }
</div>
