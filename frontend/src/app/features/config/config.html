<div class="container-fluid m-0 p-0 d-flex flex-row">
    <app-menu class="vh-100" select="gear"></app-menu>
    @if (pagina=="config") {
    <section class="main">
        <div class="main-cards gap-1 d-flex flex-column">
            <div class="option animacao d-flex justify-content-between"(click)="toConfig()">
                <h3 class="fw-bold d-flex">Sobre nós</h3>
                <img class="d-flex" src="/assets/icons/next.svg" width="28px" height="28px" alt="">
            </div>
            <a class="option animacao d-flex justify-content-between" href="https://www.instagram.com/lucas.devstudies" target="_blank">
                <h3 class="fw-bold d-flex">Preciso de ajuda</h3>
                <img class="d-flex" src="/assets/icons/next.svg" width="28px" height="28px" alt="">
            </a>
            <div class="option animacao d-flex justify-content-between" (click)="logout()">
                <h3 class="fw-bold d-flex" style="color: var(--color-red);">Sair</h3>
                <img class="d-flex" src="/assets/icons/next.svg" width="28px" height="28px" alt="">
            </div>
        </div>
    </section>
    }
    @else if(pagina=="about"){
        <section class="options">
            <app-about
                (voltar)="back()"
            ></app-about>
        </section>
    }
</div>
