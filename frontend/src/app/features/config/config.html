<div class="container-fluid m-0 p-0 d-flex flex-row">
    <app-menu class="vh-100" select="gear"></app-menu>
    @if (pagina=="config") {
    <section class="main">
        <div class="main-cards gap-1 d-flex flex-column">
                <div class="option animacao">
                    <div class="theme d-flex justify-content-between">
                        <h3 class="fw-bold">Tema</h3>
                    <div class="form-check form-switch d-flex justify-content-between">
                        <label class="form-check-label fw-bold" for="switchCheckDefault">Escuro</label>
                        <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                        <label class="form-check-label fw-bold" for="switchCheckDefault">Claro</label>
                    </div>
                </div>
            </div>
            <div class="option animacao d-flex justify-content-between"(click)="toConfig()">
                <h3 class="fw-bold d-flex">Sobre nós</h3>
                <img class="d-flex" src="/assets/icons/next.svg" width="28px" height="28px" alt="">
            </div>
            <div class="option animacao d-flex justify-content-between">
                <h3 class="fw-bold d-flex">Preciso de ajuda</h3>
                <img class="d-flex" src="/assets/icons/next.svg" width="28px" height="28px" alt="">
            </div>
            <div class="option animacao d-flex justify-content-between" (click)="logout()">
                <h3 class="fw-bold d-flex">Sair</h3>
                <img class="d-flex" src="/assets/icons/next.svg" width="28px" height="28px" alt="">
            </div>
        </div>
    </section>
    }
    @else if(pagina=="sobre"){
        <section class="options">
            <app-sobre></app-sobre>
        </section>
    }
</div>
