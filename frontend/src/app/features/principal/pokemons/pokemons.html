<div class="menu mb-1 mt-2" (click)="back()">
    <div class="menu-item">
        <h3 class="fw-bold">Voltar</h3>
    </div>
</div>
<form class="option animacao mb-5">
    <h2 class="fw-bold w-100 text-center">Selecione qual ou quais Pokémons você deseja apostar <span class="fw-bold" style="color: var(--color-red);">(max 3)</span></h2>

    <div class="info d-flex justify-content-between">
        <div class="info_container">
            <h3 class="w-100 text-center">Escolha</h3>
            <p class="w-100 fw-bold text-center">0/{{pokemonNumber}}</p>
        </div>
        <div class="info_container">
            <h3 class="w-100 text-center">Retorno</h3>
            <p class="w-100 fw-bold text-center">4000x</p>
        </div>
    </div>
    <div class="search d-flex gap-2">
        <app-custom-input
            type="search"
            ngClass="card_value w-100"
            type_input="text"
            placeholder="Pikachu"
            [(value)]="card"
        ></app-custom-input>
        <button class="search-button">
            Pesquisar
        </button>
    </div>
    <div #scrollContainer class="pokemons mb-3">
        @for (pokemon of pokemons$ | async; track pokemon.id) {
            <app-pokemon-card
                [id]="pokemon.id"
                [img]="pokemon.img"
                [name]="pokemon.name"
            >
            </app-pokemon-card>
        }
    </div>
    <div class="gap-2 d-flex justify-content-between">
        <button class="search-button w-100">
            Anterior
        </button>
        <button class="search-button w-100">
            Próximo
        </button>
    </div>
    <div class="payment">
        <div class="d-flex justify-content-between mb-2">
            <h3 class="fw-bold d-flex">Custo</h3>
            <div class="return d-flex">
                <h3 class="w-100">Retorno<span class="fw-bold">R$ {{valor}}</span></h3>
            </div>
        </div>
        <app-custom-input
            type="card"
            ngClass="card_value"
            type_input="number"
            placeholder="20,00"
            [(value)]="card"
        ></app-custom-input>
    </div>
    <app-button
        text="Seguinte"
        (click)="change()"
    ></app-button>
</form>
