<div class="container-fluid m-0 p-0 d-flex flex-row">
    <app-menu class="vh-100"></app-menu>
    <section class="main">
        @if (atual == 'principal') {
            <div class="welcome">
                <h3>Olá, <span class="fw-bold">{{ ( me$ | async )?.name }}!</span></h3>
                <p>Que tal apostar no seu <span class="fw-bold">Pokémon</span> ou <span class="fw-bold">Região favoritos?</span></p>
            </div>
            <app-opcoes
                class="animacao"
                (opcaoSelecionada)="opcoesProx($event)" 
            ></app-opcoes>
        }
        @else if (atual == 'cidades') {
            <app-cidades
                (voltar)="back()">    
            </app-cidades>
        }@else if (atual == 'pokemons') {
            <app-pokemons
                (voltar)="back()">    
            </app-pokemons>
        }
    </section>
</div>
