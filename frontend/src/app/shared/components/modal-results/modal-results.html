<div class="option modal-result gap-2 d-flex flex-column justify-content-center align-items-center">
    <h2 class="fw-bold">{{title}}</h2>
    <img src={{img}} alt="">
    <div class="texts mb-2 p-0 d-flex flex-column w-100">
        @if(textBet!=""){
            <p>{{textBet}}</p>
        }
        @if(textReceived!=""){
            <p>{{textReceived}}</p>
        }
    </div>
    <app-button
        class="w-100"
        [text]=text_button
        (click)="clickButton()"
    >
    </app-button>
</div>
