services:
  # Container do Banco de Dados
  db:
    image: mysql:8.0
    container_name: mysql_pichu
    restart: always
    environment:
      MYSQL_DATABASE: jogo_do_pichu
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Container do seu Java
  backend:
    build: ./backend
    container_name: backend_pichu
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/jogo_do_pichu?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

  # Container do seu Angular
  frontend:
    build: ./frontend
    container_name: frontend_pichu
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  db_data: