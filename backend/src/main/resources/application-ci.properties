# 1. Conexão com o MySQL do GitHub Actions
# O host é 'localhost' porque eu mapeei a porta 3306:3306 no service
spring.datasource.url=jdbc:mysql://localhost:3306/testdb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# 2. Estrutura do Banco
# 'create-drop' garante que cada execução do CI comece com um banco limpo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 3. Logs e Performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 4. Segurança (Use uma chave fixa para os testes)
api.security.token.secret=ci-secret-key-123456789-test-only